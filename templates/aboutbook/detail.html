{% extends 'base.html' %}
{% block body %}
<div class="card shadow p-4 mx-auto" style="max-width:600px;">
    <h2 class="mb-3 fw-bold">📖 Book Detail</h2>
    <p><strong>Title:</strong> {{ book.title }}</p>
    <p><strong>Author:</strong> {{ book.author }}</p>
    <p><strong>Description:</strong> {{ book.description }}</p>
    <p><strong>Price:</strong> Rs. {{ book.price }}</p>
    <hr>
    <div class="d-flex justify-content-between">
        <a href="{% url 'edit' book.id %}" class="btn btn-warning">✏️ Edit</a>
        <a href="{% url 'delete' book.id %}" class="btn btn-danger">🗑 Delete</a>
    </div>
    <a href="{% url 'book_list' %}" class="btn btn-secondary mt-3">⬅ Back</a>
</div>
{% endblock %}
