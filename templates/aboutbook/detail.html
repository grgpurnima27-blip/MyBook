{% extends 'base.html' %}

{% block body %}

<div class="row">


    <!-- Info Column -->
    <div class="col-md-7">
        <h2 class="fw-bold">{{ book.title }}</h2>
        <h5 class="text-muted">by {{ book.author }}</h5>

        <p class="mt-3">{{ book.description }}</p>

        <h3 class="text-success fw-bold mt-4">Rs. {{ book.price }}</h3>

        <div class="mt-4">
            <button class="btn btn-success btn-lg">🛒 Buy Now</button>
            <a href="/" class="btn btn-outline-secondary btn-lg">⬅ Back</a>
        </div>
    </div>

</div>

{% endblock %}
