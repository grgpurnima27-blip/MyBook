{% extends 'base.html' %}

{% block body %}

<h2 class="mb-4 fw-bold">📚 Explore Books</h2>

<div class="row">
{% for book in books %}
    <div class="col-md-4">
        <div class="card border-0 shadow-lg mb-4">

            {% if book.image %}
            <img src="{{ book.image.url }}" class="card-img-top" style="height:250px; object-fit:cover;">
            {% endif %}

            <div class="card-body">
                <h5 class="fw-bold">{{ book.title }}</h5>
                <p class="text-muted">by {{ book.author }}</p>

                <h6 class="text-success fw-bold">Rs. {{ book.price }}</h6>

                <div class="d-flex justify-content-between mt-3">
                    <a href="/book/{{ book.id }}/" class="btn btn-outline-primary btn-sm">View</a>
                    <button class="btn btn-success btn-sm">Buy</button>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
</div>

{% endblock %}
