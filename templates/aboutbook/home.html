
{% extends 'base.html' %}
{% block body %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">📚 Book Dashboard</h2>
    <a href="{% url 'create' %}" class="btn btn-success">➕ Add New Book</a>
</div>

<div class="row g-4">
    {% for book in books %}
    <div class="col-md-4">
        <div class="card shadow h-100">
            <div class="card-body">
                <h5 class="card-title">{{ book.title }}</h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
                <p class="card-text">{{ book.description|truncatewords:20 }}</p>
                <p class="fw-bold">Rs. {{ book.price }}</p>
                <a href="{% url 'detail' book.id %}" class="btn btn-info btn-sm">📖 View</a>
                <a href="{% url 'edit' book.id %}" class="btn btn-warning btn-sm">✏️ Edit</a>
                <a href="{% url 'delete' book.id %}" class="btn btn-danger btn-sm">🗑 Delete</a>
            </div>
        </div>
    </div>
    {% empty %}
        <p class="text-center">No books available. 😔</p>
    {% endfor %}
</div>

{% endblock %}
