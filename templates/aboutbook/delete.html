{% extends 'base.html' %}
{% block body %}
<div class="card shadow p-4 mx-auto" style="max-width:600px;">
    <h2 class="mb-3 fw-bold text-danger">⚠️ Delete Book</h2>
    <p class="fs-5">Are you sure you want to delete <strong>"{{ book.title }}"</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'book_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
